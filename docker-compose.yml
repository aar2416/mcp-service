services:
  zendesk-mcp:
    build: .
    image: zendesk-mcp:latest
    env_file: .env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"   # MCP endpoint: http://localhost:8000/mcp
    restart: unless-stopped
